name: Update Google Scholar Citations

on:
  schedule:
    - cron: '0 16 * * *'  # 东八区 00:00（UTC 16:00 前一天）
    - cron: '0 4 * * *'   # 东八区 12:00（UTC 04:00）
  workflow_dispatch:      # Allow manual trigger

jobs:
  update-citations:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允许 GITHUB_TOKEN 推送 commit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          # scholarly 1.7.11 未锁定传递依赖：
          # - bibtexparser 2.0 删除了 bibdatabase，from scholarly 会立刻 ModuleNotFoundError
          # - httpx 0.28+ 把 proxies= 改成了 proxy=，ProxyGenerator 会 TypeError
          pip install "scholarly==1.7.11" "bibtexparser>=1.4,<2" "httpx>=0.24,<0.28"

      - name: Update citations
        env:
          SCHOLAR_ID: '93URqlsAAAAJ'
        run: python scripts/update_citations.py

      - name: Check for changes
        id: verify-changes
        run: |
          if git diff --quiet data/publications.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.verify-changes.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add data/publications.json
          git commit -m "📊 Auto-update citation counts from Google Scholar [skip ci]"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF#refs/heads/}
