name: Update Hugging Face Downloads

on:
  schedule:
    # 东八区 00:30。引用数工作流在 00:00 写同一份 publications.json，错开半小时避免互相覆盖。
    - cron: '30 16 * * *'
  workflow_dispatch:

jobs:
  update-hf-downloads:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Update Hugging Face downloads
        run: python scripts/update_hf_downloads.py

      - name: Check for changes
        id: verify-changes
        run: |
          if git diff --quiet data/publications.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.verify-changes.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add data/publications.json
          git commit -m "🤗 Auto-update Hugging Face download counts [skip ci]"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF#refs/heads/}
